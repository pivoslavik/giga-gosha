name: giga-gosha

x-kafka-image: &kafka-image apache/kafka:4.0.1
x-topic: &matching-topic matching.jobs.v1
x-app: &app
  environment:
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: giga_gosha
    PGUSER: giga_gosha
    PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    KAFKA_BROKERS: kafka:9092
    KAFKA_MATCHING_TOPIC: *matching-topic
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1))"]
    interval: 15s
    timeout: 5s
    retries: 3

services:
  bot:
    <<: *app
    build:
      context: .
      dockerfile: services/bot/Dockerfile

  parser:
    <<: *app
    build:
      context: .
      dockerfile: services/parser/Dockerfile

  ml:
    <<: *app
    build:
      context: .
      dockerfile: services/ml/Dockerfile

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: giga_gosha
      POSTGRES_USER: giga_gosha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: *kafka-image
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", *matching-topic, "--partitions", "1", "--replication-factor", "1"]

volumes:
  postgres-data:
  kafka-data:
