name: giga-gosha

x-app: &app
  environment:
    PGHOST: ${PGHOST}
    PGPORT: ${PGPORT}
    PGDATABASE: ${POSTGRES_DB}
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    KAFKA_BROKERS: ${KAFKA_BROKERS}
    KAFKA_MATCHING_TOPIC: ${KAFKA_MATCHING_TOPIC}
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 3

services:
  bot:
    <<: *app
    build:
      context: .
      dockerfile: services/bot/Dockerfile

  parser:
    <<: *app
    build:
      context: .
      dockerfile: services/parser/Dockerfile

  ml:
    <<: *app
    build:
      context: .
      dockerfile: services/ml/Dockerfile

  integration:
    <<: *app
    build:
      context: .
      dockerfile: services/integration/Dockerfile

  postgres:
    image: postgres:17.11-bookworm
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - PGPORT
    command: postgres -p ${PGPORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.0.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_PORT},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BROKERS}
    volumes:
      - ./infra/kafka/server.properties:/mnt/shared/config/server.properties:ro,z
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BROKERS} --list
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
